{% extends "base.html" %}

{% block title %}Register – Fake News Detector{% endblock %}

{% block extra_css %}
<style>
    .register-card {
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(12px);
        border-radius: 32px;
        padding: 35px;
        box-shadow: 0 12px 28px rgba(0,0,0,0.08);
        position: relative;
    }
    .close-btn {
        position: absolute;
        top: 20px;
        right: 25px;
        font-size: 1.5rem;
        color: #6B7280;
        text-decoration: none;
        transition: 0.2s;
    }
    .close-btn:hover {
        color: #EF4444;
        transform: scale(1.1);
    }
    .btn-register {
        background: linear-gradient(135deg, #7C3AED, #10B981);
        border: none;
        padding: 12px;
        font-weight: 600;
        border-radius: 40px;
        width: 100%;
    }
</style>
{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="register-card">
            <a href="{{ url_for('index') }}" class="close-btn" title="Back to Home">
                <i class="fas fa-times-circle"></i>
            </a>
            <div class="text-center mb-4">
                <i class="fas fa-user-plus fa-3x" style="color: #10B981;"></i>
                <h3 class="mt-2">Create Account</h3>
                <p class="text-muted">Join the fight against misinformation</p>
            </div>
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label"><i class="fas fa-user me-1"></i> Username</label>
                    <input type="text" name="username" class="form-control" required placeholder="Choose a username">
                </div>
                <div class="mb-3">
                    <label class="form-label"><i class="fas fa-envelope me-1"></i> Email</label>
                    <input type="email" name="email" class="form-control" required placeholder="your@email.com">
                </div>
                <div class="mb-3">
                    <label class="form-label"><i class="fas fa-lock me-1"></i> Password</label>
                    <input type="password" name="password" class="form-control" required placeholder="Min. 6 characters">
                </div>
                <div class="mb-3">
                    <label class="form-label"><i class="fas fa-check-circle me-1"></i> Confirm Password</label>
                    <input type="password" name="confirm_password" class="form-control" required placeholder="Confirm">
                </div>
                <button type="submit" class="btn btn-primary btn-register"><i class="fas fa-user-plus me-2"></i> Register</button>
            </form>
            <hr class="border-light">
            <p class="text-center mb-0">Already have an account? <a href="{{ url_for('login') }}" class="text-primary">Login here</a></p>
        </div>
    </div>
</div>
{% endblock %}
