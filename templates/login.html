{% extends "base.html" %}

{% block title %}Login – Fake News Detector{% endblock %}

{% block extra_css %}
<style>
    .login-card {
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(12px);
        border-radius: 32px;
        padding: 35px;
        box-shadow: 0 12px 28px rgba(0,0,0,0.08);
        position: relative;
    }
    .close-btn {
        position: absolute;
        top: 20px;
        right: 25px;
        font-size: 1.5rem;
        color: #6B7280;
        text-decoration: none;
        transition: 0.2s;
    }
    .close-btn:hover {
        color: #EF4444;
        transform: scale(1.1);
    }
    .btn-login {
        background: linear-gradient(135deg, #7C3AED, #10B981);
        border: none;
        padding: 12px;
        font-weight: 600;
        border-radius: 40px;
        width: 100%;
    }
</style>
{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="login-card">
            <a href="{{ url_for('index') }}" class="close-btn" title="Back to Home">
                <i class="fas fa-times-circle"></i>
            </a>
            <div class="text-center mb-4">
                <i class="fas fa-sign-in-alt fa-3x" style="color: #7C3AED;"></i>
                <h3 class="mt-2">Welcome Back</h3>
                <p class="text-muted">Login to access your dashboard</p>
            </div>
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label"><i class="fas fa-user me-1"></i> Username</label>
                    <input type="text" name="username" class="form-control" required placeholder="Enter your username">
                </div>
                <div class="mb-3">
                    <label class="form-label"><i class="fas fa-lock me-1"></i> Password</label>
                    <input type="password" name="password" class="form-control" required placeholder="Enter your password">
                </div>
                <div class="mb-3 form-check">
                    <input type="checkbox" name="remember" class="form-check-input" id="remember">
                    <label class="form-check-label" for="remember">Remember me</label>
                </div>
                <button type="submit" class="btn btn-primary btn-login"><i class="fas fa-sign-in-alt me-2"></i> Login</button>
            </form>
            <hr class="border-light">
            <p class="text-center mb-0">Don't have an account? <a href="{{ url_for('register') }}" class="text-primary">Register here</a></p>
        </div>
        <div class="text-center mt-3 text-muted small">
            Demo: admin / admin123
        </div>
    </div>
</div>
{% endblock %}
